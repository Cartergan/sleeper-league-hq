<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="A live Sleeper fantasy football league dashboard.">
  <title>Fantasy League HQ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏈%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="League home">
        <div class="brand-mark">🏈</div>
        <div>
          <div id="brand-name">League HQ</div>
          <small id="brand-season">Sleeper Fantasy Football</small>
        </div>
      </a>
      <nav id="nav" class="nav" aria-label="Primary navigation">
        <a href="#home" data-route="home">Home</a>
        <a href="#standings" data-route="standings">Standings</a>
        <a href="#matchups" data-route="matchups">Matchups</a>
        <a href="#teams" data-route="teams">Teams</a>
        <a href="#transactions" data-route="transactions">Moves</a>
        <a href="#playoffs" data-route="playoffs">Playoffs</a>
      </nav>
      <div class="top-actions">
        <button id="refresh" class="icon-btn" title="Refresh data" aria-label="Refresh data">↻</button>
        <button id="theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">☾</button>
      </div>
    </header>

    <div id="statusbar" class="statusbar">
      <span id="status-dot" class="dot"></span>
      <span id="status-text">Loading live Sleeper data…</span>
      <span id="last-updated"></span>
    </div>

    <main id="content" class="container">
      <div class="loading-screen">
        <div class="spinner"></div>
        <h1>Loading your league</h1>
        <p>Pulling live data from Sleeper…</p>
      </div>
    </main>

    <footer class="footer">
      <div>Built for your league • Live data from Sleeper</div>
      <div><a id="sleeper-link" target="_blank" rel="noopener">Open in Sleeper ↗</a></div>
    </footer>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
